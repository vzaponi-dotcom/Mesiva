name: Validate application

on:
  pull_request:
  push:
    branches:
      - master
      - feature/spec-b-settings-policies
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test shard
        run: npm test -- --test-shard=${{ matrix.shard }}/8

  validate:
    name: validate
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate production Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Validate Spec B D1 clean install and upgrade
        run: node scripts/infra/spec-b-d1-gate.mjs

      - name: Validate printing recovery D1 read budget
        run: node scripts/infra/print-recovery-d1-benchmark.mjs

      - name: Validate operational D1 read budget
        run: node scripts/infra/operational-read-d1-benchmark.mjs
      - name: Validate operation profile D1 clean install and upgrade
        run: node scripts/infra/operation-profile-d1-gate.mjs

      - name: Validate company management D1 clean install and upgrade
        run: node scripts/infra/company-management-d1-gate.mjs
